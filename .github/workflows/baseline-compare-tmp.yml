# TEMPORARY: runs v0.0.41's implementation beside the current one on Linux over the inputs of the
# platform-dependent corpora (scripts/baseline-compare.tmp.ts) and requires identical answers.
# Removed once it has run green.
name: baseline-compare-tmp
on:
  push:
    branches: [cleanroom/linux-ci]
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: [latest, "1.3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ matrix.bun }}" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - run: pnpm install
      - run: bun run build:packages
      - name: extract v0.0.41 beside the checkout
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/tags/v0.0.41:refs/tags/v0.0.41
          BL="$RUNNER_TEMP/baseline"
          mkdir -p "$BL"
          git archive v0.0.41 | tar -x -C "$BL"
          # the corpus was recorded from v0.0.41 with this one private helper exported, nothing else changed
          sed -i 's/^function isSuspiciousRealpathResolution(/export function isSuspiciousRealpathResolution(/' "$BL/packages/runtime/src/permissions/file-rules.ts"
          grep -q '^export function isSuspiciousRealpathResolution(' "$BL/packages/runtime/src/permissions/file-rules.ts"
          ln -sfn "$PWD/node_modules" "$BL/node_modules"
          for p in runtime sdk provider-runtime provider-catalog; do
            if [ -d "packages/$p/node_modules" ]; then ln -sfn "$PWD/packages/$p/node_modules" "$BL/packages/$p/node_modules"; fi
          done
      - run: bun scripts/baseline-compare.tmp.ts "$RUNNER_TEMP/baseline"
