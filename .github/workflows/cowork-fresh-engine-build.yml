name: Build Cowork fresh engine review artifacts
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'bunfig.toml'
      - '.github/workflows/cowork-fresh-engine-build.yml'
permissions:
  contents: read
jobs:
  build-only:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install the locked dependencies without lifecycle commands
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require an ordinary native Linux ARM64 builder
        run: |
          test "$(id -u)" -ne 0
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          command -v cc
          command -v python3
      - name: Download only the independently pinned guest base
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          from pathlib import Path
          pin = json.loads(Path('scripts/linux-runtime-base.json').read_bytes())
          with urllib.request.urlopen(pin['archiveUrl'], timeout=30) as response:
              archive = response.read(64 * 1024 * 1024 + 1)
          if len(archive) > 64 * 1024 * 1024 or hashlib.sha256(archive).hexdigest() != pin['archiveSha256']:
              raise SystemExit('pinned guest archive refused')
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              entry = bundle.getinfo(pin['archiveEntry'])
              if entry.is_dir() or entry.file_size > 128 * 1024 * 1024:
                  raise SystemExit('pinned guest entry refused')
              base = bundle.read(entry)
          if hashlib.sha256(base).hexdigest() != pin['executableSha256']:
              raise SystemExit('pinned guest executable refused')
          Path('out').mkdir(mode=0o700, exist_ok=True)
          fd = os.open('out/linux-bun-base', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o500)
          try:
              with os.fdopen(fd, 'wb', closefd=False) as output:
                  output.write(base)
          finally:
              os.close(fd)
          PY
      - name: Freshly compile the real SDK engine and scripted provider fixture
        run: bun run scripts/guest-engine/compile.ts --guest-base out/linux-bun-base --out out/fresh-engine-entries
      - name: Build the native owners without executing them
        run: |
          python3 -I -S -B scripts/guest-engine/build.py --output out/fresh-engine-linux-review --runtime-entry out/fresh-engine-entries/runtimeEntry --provider-worker out/fresh-engine-entries/providerWorker --compile-receipt out/fresh-engine-entries/compile-receipt.json
      - name: Verify portable staging and evidence cases without native effects
        run: python3 -I -S -B -m unittest discover -s scripts/guest-engine -p 'test_*.py'
      - name: Retain the exact measured source and installed dependency closure
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib, importlib.util, json, tarfile
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('build_inventory', root / 'scripts/guest-engine/provenance.py')
          provenance = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(provenance)
          receipt = provenance.json_read(root / 'out/fresh-engine-linux-review/compile-receipt.json')
          inputs = receipt['inputs']
          if provenance.inventory(root) != inputs:
              raise SystemExit('measured build inputs changed before archive')
          archive = root / 'out/fresh-engine-linux-review/source.tar.gz'
          with tarfile.open(archive, 'x:gz', dereference=False) as bundle:
              for name in sorted(inputs):
                  bundle.add(root / name, arcname='source/' + name, recursive=False)
          if provenance.inventory(root) != inputs:
              raise SystemExit('measured build inputs changed during archive')
          # Validate packed bytes too; a later dependency reinstall is unnecessary.
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              if len(members) != len(inputs) or {member.name for member in members} != {'source/' + name for name in inputs}:
                  raise SystemExit('packed source inventory mismatch')
              for member in members:
                  expected = inputs[member.name.removeprefix('source/')]
                  if expected['kind'] == 'symlink':
                      if not member.issym() or member.linkname != expected['target']:
                          raise SystemExit('packed source link mismatch')
                  else:
                      if not (member.isfile() or member.islnk()) or member.size > provenance.MAX_FILE:
                          raise SystemExit('packed source type/size mismatch')
                      with bundle.extractfile(member) as stream:
                          data = stream.read(provenance.MAX_FILE + 1)
                      if len(data) != expected['bytes'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
                          raise SystemExit('packed source bytes mismatch')
          print(json.dumps({'sourceArchiveSha256': hashlib.sha256(archive.read_bytes()).hexdigest(), 'measuredInputs': len(inputs), 'linuxExecutionVerified': False, 'vmExecutionVerified': False}))
          PY
      - name: Record source, build and artifact identity for independent admission
        run: |
          sha256sum scripts/guest-engine/stage.py out/fresh-engine-linux-review/receipt.json out/fresh-engine-linux-review/compile-receipt.json
          file out/fresh-engine-linux-review/runtimeEntry out/fresh-engine-linux-review/providerWorker out/fresh-engine-linux-review/toolLauncher out/fresh-engine-linux-review/runtimeLauncher out/fresh-engine-linux-review/fileWorker out/fresh-engine-linux-review/processWorker out/fresh-engine-linux-review/ownerLibrary
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-engine-linux-review
          path: out/fresh-engine-linux-review/
          if-no-files-found: error
          retention-days: 7
