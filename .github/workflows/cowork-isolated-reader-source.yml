name: cowork-isolated-reader-source

on:
  push:
    branches: [cowork/isolated-instruction-reader, cowork/reader-runtime-compatibility]
    paths:
      - .github/workflows/cowork-isolated-reader-source.yml
      - packages/runtime/src/guest/linux-instruction-reader-compartment.c
      - packages/runtime/src/guest/linux-instruction-reader-dependency-probe.c
      - packages/runtime/src/guest/linux-compartment.h
      - scripts/guest-engine/test_instruction_reader_source.py
      - docs/linux-isolated-instruction-reader-source.md
  pull_request:
    paths:
      - .github/workflows/cowork-isolated-reader-source.yml
      - packages/runtime/src/guest/linux-instruction-reader-compartment.c
      - packages/runtime/src/guest/linux-instruction-reader-dependency-probe.c
      - packages/runtime/src/guest/linux-compartment.h
      - scripts/guest-engine/test_instruction_reader_source.py
      - docs/linux-isolated-instruction-reader-source.md

permissions:
  contents: read

jobs:
  source-only:
    if: github.event_name == 'push' || github.head_ref == 'cowork/isolated-instruction-reader' || github.head_ref == 'cowork/reader-runtime-compatibility'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Portable inert checks and complete Linux role compilation only
        # No sudo, native helper execution, namespaces, mounts, VM or proc fixture.
        # The Linux gate compiles objects and also compiles AND links ELF files with the packet
        # builder's flags; every output is only inspected as bytes and is NEVER executed.
        run: python3 -I -S scripts/guest-engine/test_instruction_reader_source.py
