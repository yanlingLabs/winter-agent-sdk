name: release
# P7a Lane C, Step 3 (WS-02 §9 item 2; Phase 7a amendment: "the publish job fires ONLY on `v*` tags
# or workflow_dispatch -- never on phase-* tags", "a CI assertion pins the on: block"). NOTHING in
# this repository's history has ever run this workflow to completion, and nothing in this PLAN does
# either (Global Constraints: "No task in this plan publishes anything: the first publish is the
# user's decision"). `release-gates.test.ts` parses this exact file and asserts the trigger set
# below is EXACTLY `v*` + `workflow_dispatch` -- no `phase-*` tag, no `push: branches`, and that no
# OTHER workflow in this repository contains the word "publish".
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
jobs:
  # --- P9a-3/P9a-4: THE DARWIN-ARM64 BINARY, BUILT ONLY ON A MATCHING RUNNER --------------------
  #
  # `bun build --compile` targets the CURRENT host -- it does not cross-compile (M1/P9a-4) -- so the
  # darwin-arm64 binary can only ever be produced on a `darwin`/`arm64` runner, and this job's FIRST
  # step asserts that with `uname` rather than trusting the `macos-15` label (a label names an image,
  # not a guarantee of what `uname` reports on it). Both publish jobs `needs: build-platform` and
  # download this job's artifact rather than rebuilding -- GitHub Actions strips the executable bit
  # from artifact uploads, which is why this job tars the binary and the publish jobs untar it and
  # restore the bit explicitly, verifying identity (Mach-O arm64, matching sha256) before either
  # registry ever sees it. This job never runs a publish command -- `release-gates.test.ts` pins that.
  build-platform:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: "assert a REAL macOS arm64 runner (P9a-4) -- never trust the `macos-15` label alone"
        run: |
          set -euo pipefail
          UNAME_S="$(uname -s)"
          UNAME_M="$(uname -m)"
          if [ "$UNAME_S" != "Darwin" ] || [ "$UNAME_M" != "arm64" ]; then
            echo "build-platform: expected Darwin/arm64, got $UNAME_S/$UNAME_M -- refusing to build the darwin-arm64 binary here" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - run: pnpm install
      - run: bun run scripts/build-runtime.ts --platform-package
      - name: "the binary's own --version matches the tag being published (workflow_dispatch has no tag: skipped)"
        run: |
          set -euo pipefail
          BIN=packages/platform/darwin-arm64/bin/winter
          ACTUAL="$("$BIN" --version)"
          echo "build-platform: binary reports --version $ACTUAL"
          case "${GITHUB_REF:-}" in
            refs/tags/v*)
              EXPECTED="${GITHUB_REF#refs/tags/v}"
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "build-platform: binary reports --version $ACTUAL but the pushed tag names $EXPECTED" >&2
                exit 1
              fi
              ;;
            *) echo "build-platform: no v* tag on this ref (workflow_dispatch) -- version-vs-tag check skipped" ;;
          esac
      - run: shasum -a 256 packages/platform/darwin-arm64/bin/winter | tee winter-darwin-arm64.sha256
      - run: tar -cf winter-darwin-arm64.tar -C packages/platform/darwin-arm64 bin/winter
      - uses: actions/upload-artifact@v4
        with:
          name: winter-darwin-arm64
          path: |
            winter-darwin-arm64.tar
            winter-darwin-arm64.sha256
          retention-days: 7

  # --- TWO REGISTRIES, TWO JOBS (P7a pre-publish item 5; user ruling 2026-09-08) ------------------
  #
  # GitHub Packages first, npm second, and SEPARATE jobs on purpose: the npm leg needs a secret this
  # repository may not have, and a missing `NPM_TOKEN` must never block the GitHub Packages publish.
  # `needs:` makes the dependency explicit -- npm runs only if GitHub Packages SUCCEEDED, so the two
  # registries can never disagree about which versions exist because the first leg failed halfway.
  # BOTH jobs now also `needs: build-platform` (P9a-4): the darwin-arm64 binary this workflow ships
  # must exist, on the real artifact, before either registry publish begins.
  publish:
    needs: build-platform
    runs-on: ubuntu-latest
    # R-7-1: GitHub Packages, scope @yanlinglabs. `contents: read` is the default job permission
    # this repeats explicitly; `packages: write` is the one elevated grant a publish needs and the
    # only reason this job's token differs from every other job in this repository's CI.
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      # P7a pre-publish r3 (review C2): THIS is what gives job 1 a GitHub Packages credential, and
      # before this round it had none -- no `//npm.pkg.github.com/:_authToken` line existed anywhere,
      # `registry-url` was absent, and pnpm never reads `NODE_AUTH_TOKEN` by name (its only token
      # plumbing is `:tokenHelper`). The first `v0.0.1` push would have failed at the publish step
      # with ENEEDAUTH and published nothing, anywhere.
      #
      # `registry-url` + `scope` make setup-node write a throwaway userconfig
      # (`$RUNNER_TEMP/.npmrc`, pointed at by `NPM_CONFIG_USERCONFIG`) carrying BOTH
      # `@yanlinglabs:registry=<url>` and `//<url>/:_authToken=${NODE_AUTH_TOKEN}` -- one mechanism
      # choosing the registry and the credential together, per job. That is why the committed
      # `.npmrc` now pins neither: a committed pin is global, and there are two registries.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: "https://npm.pkg.github.com"
          scope: "@yanlinglabs"
      - run: pnpm install
      # P9a-4: restore the darwin-arm64 binary `build-platform` produced, and VERIFY it before this
      # job's own gates or the publish step ever run -- a downloaded GitHub Actions artifact loses its
      # executable bit, so this is not optional ceremony; without `chmod +x` the smoke below fails.
      - uses: actions/download-artifact@v4
        with: { name: winter-darwin-arm64 }
      - name: "restore + verify the platform binary before anything downstream can publish it"
        run: |
          set -euo pipefail
          tar -xf winter-darwin-arm64.tar -C packages/platform/darwin-arm64
          BIN=packages/platform/darwin-arm64/bin/winter
          chmod +x "$BIN"
          test -x "$BIN"
          file "$BIN" | grep -Eq "Mach-O 64-bit (executable arm64|arm64 executable)" || { echo "restore: $BIN is not a Mach-O 64-bit arm64 executable" >&2; file "$BIN" >&2; exit 1; }   # macOS file(1) prints "executable arm64", ubuntu's prints "arm64 executable" (the v0.0.5 first run failed here, pre-publish)
          shasum -a 256 -c winter-darwin-arm64.sha256

      # --- the gates: the exact verification sequence ci.yml's `build` and `official-fixture-compile`
      # jobs already run on every push, repeated here so a tag pushed out of step with CI history (or
      # a workflow_dispatch on an arbitrary ref) is never published unverified. Keep this list in
      # sync with ci.yml by hand -- there is no reusable-workflow indirection here, matching this
      # repository's own existing convention of two independent jobs in ci.yml each repeating their
      # own checkout/setup steps rather than sharing them. ---
      - run: bun run build:packages                # P7a fix wave r2 (item 2): FIRST, for the same reason
                                                     # ci.yml's build job runs it first -- `bun test` and the
                                                     # consumer-fixture `tsc` two steps down both resolve through
                                                     # a package's `types` condition, i.e. `./dist/*.d.ts`. Built
                                                     # AGAIN immediately before `pnpm publish` below: fourteen
                                                     # steps run in between, and the bytes that SHIP must be built
                                                     # by a step adjacent to the one that publishes them.
      - run: bun test
      - run: bun run typecheck
      - run: bun run conformance:fetch
      - run: bun run conformance:snapshot -- --check
      - run: bunx tsc --noEmit -p packages/conformance/tsconfig.winter.json
      - run: bunx tsc --noEmit -p packages/conformance/tsconfig.winter-dist.json   # P7a pre-publish item 3: the SAME fixture against the BUILT declarations -- what an installed consumer actually resolves
      - run: bun run provider:catalog -- --check
      - run: bun run provider:sync -- --offline
      - run: bun run differential
      - run: bun run verify:compiled
      - run: bun run verify:workflow
      - run: bun run scripts/compile-official-fixture.ts

      # --- Step 1's pack + tarball identity/name scan, PLUS (review r1, Important-4) the
      # install-from-tarball smoke covering every publishable package's full exports map, both
      # BLOCKING here on purpose -- the last gates before anything is published. A hit in the scan
      # (a forbidden directory, a credentials-shaped file, an identity mismatch) or an import failure
      # under EITHER runtime fails these steps and the workflow stops -- `pnpm publish` below never
      # runs. `scripts/smoke-installed.ts` (shared with ci.yml's `pack-smoke`/`pack-smoke-node18`)
      # does the pack + the one offline `npm install` of every tarball + the import checks in one
      # call per runtime.
      #
      # WS-02 §9 item 3 ("a dry-run pack + install-from-tarball smoke test (Node 18 and Bun) gates
      # every publish"). BOTH legs are BLOCKING, here and in ci.yml alike: the compiled emit landed in
      # this phase's fix wave, so `pack-smoke-node18` is no longer advisory either (R-7a-16 reversed).
      # A publish is exactly where "a consumer cannot import what we shipped" must stop the workflow,
      # and there is no `continue-on-error` on this job or on any of its steps. ---
      - run: bun run scripts/smoke-installed.ts --runtime=node   # BLOCKING
      - run: bun run scripts/smoke-installed.ts --runtime=bun    # BLOCKING

      # version:bump / version:sync are DELIBERATELY not run here. WS-02 §9 item 2 says "every
      # publish is preceded by version:bump + version:sync", but that is the OPERATOR'S own action
      # before tagging (bump -> commit -> tag vX.Y.Z -> push) -- a workflow that bumped and committed
      # a new version on every tag push would create a commit the pushed tag does not point at, and
      # would need write access back to a branch the tag need not even track. The published version
      # is exactly what VERSION already says at the tagged commit.
      # P7a pre-publish (item 6): THE VERSION/TAG CONSISTENCY GATE, before anything is published.
      # A publish is triggered by pushing `v<version>`, and what actually ships is whatever the
      # manifests say at that commit -- equal only because a human ran the bump before tagging.
      # Diverging does not fail the publish, it SUCCEEDS at publishing the wrong number, to registries
      # where a version can never be re-published. `GITHUB_REF` is the pushed ref; on
      # `workflow_dispatch` there is no tag and the manifest-vs-VERSION half still runs.
      - run: bun run scripts/check-release-version.ts

      # P7a fix wave r2 (item 2, re-review N2): the compiled emit is built EXPLICITLY, immediately
      # before the one publish command, and never left to a smoke step's side effect. `releasePack()`
      # does build first -- which is why the smokes above pass -- but `pnpm publish` does not go
      # through `releasePack()` at all: it packs each workspace package itself, from whatever is on
      # disk. Relying on an earlier step's leftovers to populate the tarballs that actually SHIP is a
      # dependency nothing states and nothing checks, and the failure mode is silent: a package whose
      # `default` condition names a file that is simply absent from the published tarball.
      - run: bun run build:packages
      # P7a pre-publish r3 (review §5): IDEMPOTENT RE-DRIVE. `pnpm publish -r` already skips a version
      # its own probe finds published, but that probe swallows every error as "not published", so it
      # is not something to rely on for the recovery path. This step states the fact out loud, per
      # package, before the publish -- so a half-done release is finished by a `workflow_dispatch` at
      # the SAME tag rather than by a version bump, and the log says which packages were skipped and
      # why. `--no-git-checks` because the tag ref is a detached HEAD.
      - name: "report which versions this registry already has"
        run: bun run scripts/check-already-published.ts --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm publish -r --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- THE npm LEG (P7a pre-publish item 5) --------------------------------------------------------
  #
  # `needs: publish` -- it runs only after GitHub Packages succeeded, so a half-published pair is not
  # possible in the direction that matters (npm is the registry a version can never be taken back
  # from). A missing `NPM_TOKEN` skips this job's publish step and leaves the GitHub Packages publish
  # untouched, which is why this is a separate job rather than two steps in one.
  #
  # `--registry https://registry.npmjs.org` OVERRIDES `.npmrc`'s scope pin for this command only: that
  # file makes GitHub Packages the default for `@yanlinglabs` precisely so nothing reaches npm by
  # accident, and this is the one place that is deliberate.
  #
  # `--access public` is EXPLICIT: `publishConfig.access` stays `restricted` (it is GitHub Packages'
  # setting and npm's default for a scoped package would otherwise be restricted too, which the free
  # plan cannot do). Scoped packages on npm's free plan are public -- the user has ruled that they
  # are published publicly, and the tarballs ship COMPILED OUTPUT ONLY (round 2, item 8) -- the sources
  # live in this repository, not in the package.
  #
  # NOT THE WHOLE SET (user ruling 2026-09-08). npm gets EXACTLY the wrapper and its transitive
  # workspace `dependencies` closure -- what installing the wrapper by name needs at run time -- and
  # nothing else. The provider runtime and the two conformance harnesses stay
  # GitHub-Packages-only: the harnesses are the org's own test tooling, and the wrapper SPAWNS the
  # compiled runtime rather than importing it, so a public consumer never needs that package.
  #
  # The set is DATA (`winter.publish.npm` per manifest) and this job asks `scripts/npm-publish-set.ts`
  # for the `--filter` arguments at run time: a package name written HERE would be a second copy of a
  # fact the manifests already carry, and the copy that drifts. `release-gates.test.ts` asserts the
  # flagged set EQUALS that closure -- exactly, in both directions, with no exceptions mechanism -- so
  # a new runtime dependency cannot be forgotten and nothing else can be added.
  #
  # `--provenance` attaches a signed npm provenance statement, which is why this job -- and ONLY this
  # job -- carries `id-token: write`. `contents: read` is repeated explicitly beside it; nothing here
  # needs `packages: write` (that is the other job's grant and stays there).
  publish-npm:
    # P9a-4: keeps `needs: publish` (npm never runs until GitHub Packages succeeded) AND gains
    # `needs: build-platform` (the darwin-arm64 binary this job's own npm publish ships must exist on
    # the real artifact too -- this job checks out and downloads afresh, exactly like job 1).
    needs: [publish, build-platform]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      # Same mechanism as job 1, different registry and different credential -- `scope` is what makes
      # it bind `@yanlinglabs` to npmjs for THIS job only (review C1: a committed scope pin beat
      # `--registry` at both the pnpm and the npm layer, so nothing ever reached npm).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          scope: "@yanlinglabs"
      - run: pnpm install
      # P9a-4: same restore + verify as job 1 -- BEFORE this job's own gates or its publish step.
      - uses: actions/download-artifact@v4
        with: { name: winter-darwin-arm64 }
      - name: "restore + verify the platform binary before anything downstream can publish it"
        run: |
          set -euo pipefail
          tar -xf winter-darwin-arm64.tar -C packages/platform/darwin-arm64
          BIN=packages/platform/darwin-arm64/bin/winter
          chmod +x "$BIN"
          test -x "$BIN"
          file "$BIN" | grep -Eq "Mach-O 64-bit (executable arm64|arm64 executable)" || { echo "restore: $BIN is not a Mach-O 64-bit arm64 executable" >&2; file "$BIN" >&2; exit 1; }   # macOS file(1) prints "executable arm64", ubuntu's prints "arm64 executable" (the v0.0.5 first run failed here, pre-publish)
          shasum -a 256 -c winter-darwin-arm64.sha256
      # The same two gates the GitHub Packages job ran, repeated here because this job checks out
      # afresh: the version/tag agreement, and the compiled emit the tarballs must contain.
      - run: bun run scripts/check-release-version.ts
      - run: bun run build:packages
      # TOKEN-GATED. `if:` cannot read `secrets` directly in a job-level condition, so the secret is
      # lifted into `env` on the step and the condition tests THAT -- the documented pattern, and the
      # reason this is a step-level gate rather than a job-level one. With no token the step is
      # SKIPPED (green), the workflow succeeds, and GitHub Packages has already published.
      # P7a pre-publish r3 (review M1): the npm set reaches the publish through `$GITHUB_OUTPUT`, not
      # a `$(…)` substitution inside the command. A failing substitution used to degrade the command
      # to an unfiltered, non-recursive `pnpm publish` in the workspace root -- which fails, because
      # the root is private, but for a reason that has nothing to do with what went wrong. A step
      # that cannot produce its output fails as itself.
      - id: npm-set
        run: |
          set -euo pipefail
          # `set -e` does NOT fire on a failed command substitution inside a simple command's
          # argument (measured: `echo "x=$(exit 3)"` exits 0), so the round-3 form went GREEN with an
          # empty output and the failure only surfaced one step later. Assigned on its own line --
          # where `set -e` does fire -- and then checked explicitly, so this step fails as itself.
          ARGS="$(bun run scripts/npm-publish-set.ts --format=names)"
          if [ -z "$ARGS" ]; then
            echo "npm-set: scripts/npm-publish-set.ts produced no packages -- refusing to continue" >&2
            exit 1
          fi
          echo "tarball-args=$ARGS" >> "$GITHUB_OUTPUT"

      # P7a pre-publish r3 (review I1): PER PACKAGE, with `npm publish <tarball>`, because pnpm's
      # recursive publish REBUILDS npm's argv and forwards only `--access`/`--dry-run`/`--force`/
      # `--otp` -- `--provenance` was silently dropped, `id-token: write` was granted and never used,
      # and the YAML-text assertion kept passing. The tarballs come from `pnpm pack`, so the
      # dist-only `publishConfig` overrides still apply (plain `npm pack` would ignore them).
      #
      # The skip-if-exists probe runs inside the same script, per package, against THIS registry: a
      # `workflow_dispatch` re-drive at the same tag finishes a half-done release instead of
      # colliding on a version that is already there.
      # --- RUNBOOK: what to do when this job fails after job 1 succeeded -------------------------
      #
      # 1. DO NOT bump the version. Both registries refuse a version they already hold, so a bump
      #    would leave the tag naming something other than what shipped. Re-drive instead:
      #    `workflow_dispatch` at the SAME tag ref. Both jobs skip what their own registry already
      #    has (`check-already-published.ts` here and in job 1), so the re-drive finishes the half
      #    that failed and reports the half that did not need doing.
      # 2. `NPM_TOKEN` must exist BEFORE the tag is pushed. Without it this job's publish step is
      #    SKIPPED and the workflow goes green with GitHub Packages published and npm empty; adding
      #    the secret afterwards ships nothing until a `workflow_dispatch` re-drive at that tag.
      # 3. NEVER pack or publish these packages with plain `npm` by hand. The tarballs are dist-only
      #    through `publishConfig.exports`/`files` overrides, which pnpm applies at pack time and
      #    `npm pack` IGNORES -- a hand-packed tarball would carry a manifest whose `bun` condition
      #    names a `src/` that is not in it. `scripts/publish-npm-set.ts` packs through
      #    `releasePack()` (pnpm) and publishes the resulting tarballs with `npm publish`, which is
      #    the only combination that gets both the overrides and `--provenance`.
      - name: "publish to npm (skipped when NPM_TOKEN is absent)"
        if: ${{ env.NPM_TOKEN != '' }}
        run: bun run scripts/publish-npm-set.ts --packages "${{ steps.npm-set.outputs.tarball-args }}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
