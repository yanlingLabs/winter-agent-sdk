name: release
# P7a Lane C, Step 3 (WS-02 §9 item 2; Phase 7a amendment: "the publish job fires ONLY on `v*` tags
# or workflow_dispatch -- never on phase-* tags", "a CI assertion pins the on: block"). NOTHING in
# this repository's history has ever run this workflow to completion, and nothing in this PLAN does
# either (Global Constraints: "No task in this plan publishes anything: the first publish is the
# user's decision"). `release-gates.test.ts` parses this exact file and asserts the trigger set
# below is EXACTLY `v*` + `workflow_dispatch` -- no `phase-*` tag, no `push: branches`, and that no
# OTHER workflow in this repository contains the word "publish".
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
jobs:
  # --- TWO REGISTRIES, TWO JOBS (P7a pre-publish item 5; user ruling 2026-09-08) ------------------
  #
  # GitHub Packages first, npm second, and SEPARATE jobs on purpose: the npm leg needs a secret this
  # repository may not have, and a missing `NPM_TOKEN` must never block the GitHub Packages publish.
  # `needs:` makes the dependency explicit -- npm runs only if GitHub Packages SUCCEEDED, so the two
  # registries can never disagree about which versions exist because the first leg failed halfway.
  publish:
    runs-on: ubuntu-latest
    # R-7-1: GitHub Packages, scope @yanlinglabs. `contents: read` is the default job permission
    # this repeats explicitly; `packages: write` is the one elevated grant a publish needs and the
    # only reason this job's token differs from every other job in this repository's CI.
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: pnpm install

      # --- the gates: the exact verification sequence ci.yml's `build` and `official-fixture-compile`
      # jobs already run on every push, repeated here so a tag pushed out of step with CI history (or
      # a workflow_dispatch on an arbitrary ref) is never published unverified. Keep this list in
      # sync with ci.yml by hand -- there is no reusable-workflow indirection here, matching this
      # repository's own existing convention of two independent jobs in ci.yml each repeating their
      # own checkout/setup steps rather than sharing them. ---
      - run: bun run build:packages                # P7a fix wave r2 (item 2): FIRST, for the same reason
                                                     # ci.yml's build job runs it first -- `bun test` and the
                                                     # consumer-fixture `tsc` two steps down both resolve through
                                                     # a package's `types` condition, i.e. `./dist/*.d.ts`. Built
                                                     # AGAIN immediately before `pnpm publish` below: fourteen
                                                     # steps run in between, and the bytes that SHIP must be built
                                                     # by a step adjacent to the one that publishes them.
      - run: bun test
      - run: bun run typecheck
      - run: bun run conformance:fetch
      - run: bun run conformance:snapshot -- --check
      - run: bunx tsc --noEmit -p packages/conformance/tsconfig.winter.json
      - run: bunx tsc --noEmit -p packages/conformance/tsconfig.winter-dist.json   # P7a pre-publish item 3: the SAME fixture against the BUILT declarations -- what an installed consumer actually resolves
      - run: bun run provider:catalog -- --check
      - run: bun run provider:sync -- --offline
      - run: bun run differential
      - run: bun run verify:compiled
      - run: bun run verify:workflow
      - run: bun run scripts/compile-official-fixture.ts

      # --- Step 1's pack + tarball identity/name scan, PLUS (review r1, Important-4) the
      # install-from-tarball smoke covering every publishable package's full exports map, both
      # BLOCKING here on purpose -- the last gates before anything is published. A hit in the scan
      # (a forbidden directory, a credentials-shaped file, an identity mismatch) or an import failure
      # under EITHER runtime fails these steps and the workflow stops -- `pnpm publish` below never
      # runs. `scripts/smoke-installed.ts` (shared with ci.yml's `pack-smoke`/`pack-smoke-node18`)
      # does the pack + the one offline `npm install` of every tarball + the import checks in one
      # call per runtime.
      #
      # WS-02 §9 item 3 ("a dry-run pack + install-from-tarball smoke test (Node 18 and Bun) gates
      # every publish"). BOTH legs are BLOCKING, here and in ci.yml alike: the compiled emit landed in
      # this phase's fix wave, so `pack-smoke-node18` is no longer advisory either (R-7a-16 reversed).
      # A publish is exactly where "a consumer cannot import what we shipped" must stop the workflow,
      # and there is no `continue-on-error` on this job or on any of its steps. ---
      - run: bun run scripts/smoke-installed.ts --runtime=node   # BLOCKING
      - run: bun run scripts/smoke-installed.ts --runtime=bun    # BLOCKING

      # version:bump / version:sync are DELIBERATELY not run here. WS-02 §9 item 2 says "every
      # publish is preceded by version:bump + version:sync", but that is the OPERATOR'S own action
      # before tagging (bump -> commit -> tag vX.Y.Z -> push) -- a workflow that bumped and committed
      # a new version on every tag push would create a commit the pushed tag does not point at, and
      # would need write access back to a branch the tag need not even track. The published version
      # is exactly what VERSION already says at the tagged commit.
      # P7a pre-publish (item 6): THE VERSION/TAG CONSISTENCY GATE, before anything is published.
      # A publish is triggered by pushing `v<version>`, and what actually ships is whatever the
      # manifests say at that commit -- equal only because a human ran the bump before tagging.
      # Diverging does not fail the publish, it SUCCEEDS at publishing the wrong number, to registries
      # where a version can never be re-published. `GITHUB_REF` is the pushed ref; on
      # `workflow_dispatch` there is no tag and the manifest-vs-VERSION half still runs.
      - run: bun run scripts/check-release-version.ts

      # P7a fix wave r2 (item 2, re-review N2): the compiled emit is built EXPLICITLY, immediately
      # before the one publish command, and never left to a smoke step's side effect. `releasePack()`
      # does build first -- which is why the smokes above pass -- but `pnpm publish` does not go
      # through `releasePack()` at all: it packs each workspace package itself, from whatever is on
      # disk. Relying on an earlier step's leftovers to populate the tarballs that actually SHIP is a
      # dependency nothing states and nothing checks, and the failure mode is silent: a package whose
      # `default` condition names a file that is simply absent from the published tarball.
      - run: bun run build:packages
      - run: pnpm publish -r --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- THE npm LEG (P7a pre-publish item 5) --------------------------------------------------------
  #
  # `needs: publish` -- it runs only after GitHub Packages succeeded, so a half-published pair is not
  # possible in the direction that matters (npm is the registry a version can never be taken back
  # from). A missing `NPM_TOKEN` skips this job's publish step and leaves the GitHub Packages publish
  # untouched, which is why this is a separate job rather than two steps in one.
  #
  # `--registry https://registry.npmjs.org` OVERRIDES `.npmrc`'s scope pin for this command only: that
  # file makes GitHub Packages the default for `@yanlinglabs` precisely so nothing reaches npm by
  # accident, and this is the one place that is deliberate.
  #
  # `--access public` is EXPLICIT: `publishConfig.access` stays `restricted` (it is GitHub Packages'
  # setting and npm's default for a scoped package would otherwise be restricted too, which the free
  # plan cannot do). Scoped packages on npm's free plan are public -- the user has ruled that they
  # are published publicly, and the packages are source-visible either way (the tarballs ship `src/`).
  #
  # NOT THE WHOLE SET (user ruling 2026-09-08). npm gets EXACTLY the wrapper and its transitive
  # workspace `dependencies` closure -- what installing the wrapper by name needs at run time -- and
  # nothing else. The provider runtime and the two conformance harnesses stay
  # GitHub-Packages-only: the harnesses are the org's own test tooling, and the wrapper SPAWNS the
  # compiled runtime rather than importing it, so a public consumer never needs that package.
  #
  # The set is DATA (`winter.publish.npm` per manifest) and this job asks `scripts/npm-publish-set.ts`
  # for the `--filter` arguments at run time: a package name written HERE would be a second copy of a
  # fact the manifests already carry, and the copy that drifts. `release-gates.test.ts` asserts the
  # flagged set EQUALS that closure -- exactly, in both directions, with no exceptions mechanism -- so
  # a new runtime dependency cannot be forgotten and nothing else can be added.
  #
  # `--provenance` attaches a signed npm provenance statement, which is why this job -- and ONLY this
  # job -- carries `id-token: write`. `contents: read` is repeated explicitly beside it; nothing here
  # needs `packages: write` (that is the other job's grant and stays there).
  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install
      # The same two gates the GitHub Packages job ran, repeated here because this job checks out
      # afresh: the version/tag agreement, and the compiled emit the tarballs must contain.
      - run: bun run scripts/check-release-version.ts
      - run: bun run build:packages
      # TOKEN-GATED. `if:` cannot read `secrets` directly in a job-level condition, so the secret is
      # lifted into `env` on the step and the condition tests THAT -- the documented pattern, and the
      # reason this is a step-level gate rather than a job-level one. With no token the step is
      # SKIPPED (green), the workflow succeeds, and GitHub Packages has already published.
      - name: "publish to npm (skipped when NPM_TOKEN is absent)"
        if: ${{ env.NPM_TOKEN != '' }}
        run: pnpm publish $(bun run scripts/npm-publish-set.ts) --no-git-checks --registry https://registry.npmjs.org --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
