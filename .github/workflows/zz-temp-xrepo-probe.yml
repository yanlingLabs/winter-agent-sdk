name: TEMP cross-repo artifact read probe (removed before merge)
on:
  pull_request:
    paths:
      - '.github/workflows/zz-temp-xrepo-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reader-only-result-38727104090
          run-id: 38727104090
          repository: yanlingLabs/winter-runtime-sdk
          github-token: ${{ github.token }}
          path: probe-download
      - run: ls -A probe-download | head -3; wc -c probe-download/* | tail -1
