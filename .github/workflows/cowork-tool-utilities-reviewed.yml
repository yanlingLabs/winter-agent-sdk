name: Reviewed confined Cowork utility fixture
on:
  pull_request:
    paths:
      - '.github/workflows/cowork-tool-utilities-reviewed.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: cowork-reviewed-utilities-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reviewed-disposable-utilities:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'cowork/linux-tool-devices'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      # Fixed review bundle; never select a latest successful build dynamically.
      - uses: actions/download-artifact@v4
        with:
          name: direct-tool-utility-review
          run-id: 38367175094
          github-token: ${{ github.token }}
          path: out/utility-approved
      - name: Verify pinned inputs as the ordinary runner
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib, json, os, stat
          from pathlib import PurePosixPath
          if os.geteuid() == 0:
              raise SystemExit('ordinary input verification required')
          pins = [
              ('out/utility-approved/receipt.json', 16777216, '138df6065d899ca72d12419e162e2368b0039ae43f834b40309e6f55db918afc'),
              ('out/utility-approved/bundle.tar.gz', 268435456, '0028b1196755600075e0991060e0ac0438e62217a1ff31817e6afcfd441f1685'),
              ('scripts/guest-utilities/stage.py', 33554432, 'f79b2354dbecfd8040fcb493e438bf1c49e1b064db70b4a4bf1fc867dcb288a8'),
          ]
          for name, limit, expected in pins:
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > limit:
                      raise SystemExit('approved input identity or bound')
                  with os.fdopen(os.dup(fd), 'rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  after = os.fstat(fd)
                  identity = lambda info: (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_nlink)
                  if identity(before) != identity(after) or digest != expected:
                      raise SystemExit('approved input bytes changed')
              finally:
                  os.close(fd)
          # A later source change needs a newly reviewed build. Dependencies are
          # supplied solely by the sealed bundle, not installed from this checkout.
          fd = os.open('out/utility-approved/receipt.json', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
          try:
              wire = os.pread(fd, 16777217, 0)
          finally:
              os.close(fd)
          if len(wire) > 16777216 or hashlib.sha256(wire).hexdigest() != pins[0][2]:
              raise SystemExit('approved receipt changed')
          receipt = json.loads(wire)
          for name, item in receipt['compile']['inputs'].items():
              path = PurePosixPath(name)
              if path.is_absolute() or str(path) != name or any(part in ('.', '..') for part in path.parts):
                  raise SystemExit('approved source path')
              if 'node_modules' in path.parts:
                  continue
              if item['kind'] == 'symlink':
                  if os.readlink(name) != item['target']:
                      raise SystemExit('approved source link changed')
                  continue
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              try:
                  info = os.fstat(fd)
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_size != item['bytes'] or info.st_size > 16777216:
                      raise SystemExit('approved source identity or bound')
                  with os.fdopen(os.dup(fd), 'rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  if digest != item['sha256']:
                      raise SystemExit('approved current source changed')
              finally:
                  os.close(fd)
          PY
      - name: Run the externally admitted parent on disposable fixture data
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          sudo -n /usr/bin/python3 -I -S -B -c '
          import hashlib,os,stat,sys
          source,digest,*arguments=sys.argv[1:]
          fd=os.open(source,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK|os.O_CLOEXEC)
          try:
              identity=os.fstat(fd)
              if not stat.S_ISREG(identity.st_mode) or identity.st_nlink!=1 or identity.st_size>33554432:raise SystemExit("parent identity refused")
              data=os.pread(fd,33554433,0)
          finally:os.close(fd)
          if len(data)!=identity.st_size or hashlib.sha256(data).hexdigest()!=digest:raise SystemExit("unreviewed parent refused")
          sys.argv=[source,*arguments]
          exec(compile(data,"<reviewed-utility-parent>","exec"),{"__name__":"__main__","__file__":source})
          ' scripts/guest-utilities/stage.py f79b2354dbecfd8040fcb493e438bf1c49e1b064db70b4a4bf1fc867dcb288a8 --archive out/utility-approved/bundle.tar.gz --approved-archive-sha256 0028b1196755600075e0991060e0ac0438e62217a1ff31817e6afcfd441f1685 --approved-receipt-sha256 138df6065d899ca72d12419e162e2368b0039ae43f834b40309e6f55db918afc --approved-parent-sha256 f79b2354dbecfd8040fcb493e438bf1c49e1b064db70b4a4bf1fc867dcb288a8 --run
