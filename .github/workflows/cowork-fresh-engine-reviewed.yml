name: Reviewed Cowork fresh SDK conversation fixture
on:
  pull_request:
    paths:
      - '.github/workflows/cowork-fresh-engine-reviewed.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: cowork-reviewed-engine-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reviewed-disposable-conversation:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'cowork/fresh-engine-staging'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # This is the exact independently reviewed build, never a latest-run lookup.
      - uses: actions/download-artifact@v4
        with:
          name: fresh-engine-linux-review
          run-id: 38304552896
          github-token: ${{ github.token }}
          path: out/fresh-engine-approved
      - name: Verify and unpack the measured source as the ordinary runner
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib, json, os, stat, tarfile
          from pathlib import Path, PurePosixPath
          if os.geteuid() == 0:
              raise SystemExit('source unpack must be unprivileged')
          folder = Path('out/fresh-engine-approved')
          def bounded(name, limit, expected, root=folder):
              fd = os.open(root / name, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK)
              try:
                  identity = os.fstat(fd)
                  if not stat.S_ISREG(identity.st_mode) or identity.st_nlink != 1 or identity.st_size > limit:
                      raise SystemExit('approved input identity/limit')
                  wire = os.pread(fd, limit + 1, 0)
              finally:
                  os.close(fd)
              if len(wire) != identity.st_size or hashlib.sha256(wire).hexdigest() != expected:
                  raise SystemExit('approved input bytes changed')
              return wire
          compiled = json.loads(bounded('compile-receipt.json', 16 * 1024 * 1024, '977c6f2877ce4bffa29f036bf84f5649fca3f3f552f0e3eceaebff7f8399da7e'))
          native = json.loads(bounded('receipt.json', 16 * 1024 * 1024, 'de80c823b2869a3cc148f2202bc7e3de0c06bb35908f3c2603b908e6171b6d95'))
          # Refuse stale fixture runs on subsequent source changes. The approved
          # snapshot remains frozen; a new source needs a new reviewed build.
          for name, digest in native['sources'].items():
              path = PurePosixPath(name)
              if path.is_absolute() or str(path) != name or any(part in ('.', '..') for part in path.parts):
                  raise SystemExit('approved current source path')
              bounded(name, 16 * 1024 * 1024, digest, root=Path.cwd())
          archive = bounded('source.tar.gz', 64 * 1024 * 1024, 'e31b85b24ba606b48df438f4e688b02cd5d27fa0ee9b56f1684d2318d93c9e76')
          import io
          destination = folder / 'unpacked'
          destination.mkdir(mode=0o700)
          expected = {'source/' + name: item for name, item in compiled['inputs'].items()}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              members = bundle.getmembers()
              if len(members) != len(expected) or len(members) > 20000 or {item.name for item in members} != set(expected):
                  raise SystemExit('approved source archive inventory')
              total = 0
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or str(path) != member.name or any(part in ('.', '..') for part in path.parts):
                      raise SystemExit('approved source archive path')
                  item = expected[member.name]
                  if item['kind'] == 'symlink':
                      if not member.issym() or member.linkname != item['target']:
                          raise SystemExit('approved source archive link')
                  else:
                      if not (member.isfile() or member.islnk()) or member.size > 16 * 1024 * 1024:
                          raise SystemExit('approved source archive type/limit')
                      with bundle.extractfile(member) as stream:
                          wire = stream.read(16 * 1024 * 1024 + 1)
                      total += len(wire)
                      if total > 256 * 1024 * 1024 or len(wire) != item['bytes'] or hashlib.sha256(wire).hexdigest() != item['sha256']:
                          raise SystemExit('approved source archive bytes/limit')
              # Standard-library data filter; no project imports or code execution.
              bundle.extractall(destination, members=members, filter='data')
          PY
      - name: Require existing fixture facilities without changing the host
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          command -v /usr/bin/python3
          command -v /bin/bash
          command -v /bin/sleep
          command -v /bin/cat
          command -v /usr/bin/setsid
          command -v ldd
      - name: Run only the externally admitted parent on disposable fixture data
        run: |
          sudo -n /usr/bin/python3 -I -S -B -c '
          import hashlib,os,stat,sys
          source,digest,*arguments=sys.argv[1:]
          fd=os.open(source,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK|os.O_CLOEXEC)
          try:
              identity=os.fstat(fd)
              if not stat.S_ISREG(identity.st_mode) or identity.st_nlink!=1 or identity.st_size>16777216:raise SystemExit("parent identity refused")
              data=os.pread(fd,16777217,0)
          finally:os.close(fd)
          if len(data)!=identity.st_size or hashlib.sha256(data).hexdigest()!=digest:raise SystemExit("unreviewed parent refused")
          sys.argv=[source,*arguments]
          exec(compile(data,"<reviewed-fresh-parent>","exec"),{"__name__":"__main__","__file__":source})
          ' out/fresh-engine-approved/unpacked/source/scripts/guest-engine/stage.py a801bc4fe5d6c207ee5b09a471f9c5bb79379f6106fa0a4e19e70f2c8a3d6496 --source out/fresh-engine-approved/unpacked/source --artifacts out/fresh-engine-approved --receipt out/fresh-engine-approved/receipt.json --approved-receipt-sha256 de80c823b2869a3cc148f2202bc7e3de0c06bb35908f3c2603b908e6171b6d95 --approved-parent-sha256 a801bc4fe5d6c207ee5b09a471f9c5bb79379f6106fa0a4e19e70f2c8a3d6496
