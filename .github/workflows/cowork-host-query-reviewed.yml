name: Reviewed Cowork SDK host-query fixture
on:
  pull_request:
    paths:
      - '.github/workflows/cowork-host-query-reviewed.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: cowork-reviewed-host-query-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reviewed-disposable-host-query:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'cowork/linux-host-query-fixture'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: host-query-linux-review
          run-id: 38426042420
          github-token: ${{ github.token }}
          path: out/host-query-approved
      - name: Verify the exact build and current source without privilege
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib, json, os, stat
          from pathlib import Path, PurePosixPath
          if os.getuid() == 0 or os.geteuid() == 0:
              raise SystemExit('ordinary source verification required')
          folder = Path('out/host-query-approved')
          def bounded(path, limit, expected):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > limit:
                      raise SystemExit('approved input identity/bound')
                  digest = hashlib.sha256(); wire = bytearray()
                  while True:
                      part = os.read(fd, min(65536, limit - len(wire) + 1))
                      if not part: break
                      wire.extend(part)
                      if len(wire) > limit: raise SystemExit('approved input bound')
                      digest.update(part)
                  after = os.fstat(fd)
                  identity = lambda value: (value.st_dev, value.st_ino, value.st_size, value.st_mtime_ns, value.st_nlink)
                  if identity(before) != identity(after) or len(wire) != before.st_size or digest.hexdigest() != expected:
                      raise SystemExit('approved input bytes changed')
                  return bytes(wire)
              finally:
                  os.close(fd)
          native = json.loads(bounded(folder / 'receipt.json', 16777216, '62d2f8d5008724702bf1440b2aa9bdcd3d28ddbbf79247a1d1bac63ef49ca3b7'))
          compiled = json.loads(bounded(folder / 'compile-receipt.json', 16777216, '724f90b9ca31b63f9bf2d19d111e500f918aaf8b0513b70a5cde998aec0cac9d'))
          bounded(folder / 'source.tar.gz', 268435456, '2d4eba662b891c0b2c41881f1731e8a685a0e0011043da9f5ac4aac52b69d9cb')
          for name, item in compiled['inputs'].items():
              path = PurePosixPath(name)
              if path.is_absolute() or str(path) != name or any(part in ('.', '..') for part in path.parts):
                  raise SystemExit('approved current source path')
              if 'node_modules' in path.parts: continue
              if item['kind'] == 'symlink':
                  if os.readlink(name) != item['target']: raise SystemExit('approved current source link changed')
              else:
                  bounded(Path(name), 16777216, item['sha256'])
          for name, digest in native['artifacts'].items():
              bounded(folder / name, 134217728, digest)
          for name, output in compiled['outputs'].items():
              bounded(folder / (name + '.metafile.json'), 16777216, output['metafileSha256'])
          bounded(Path('scripts/guest-host-query/stage.py'), 16777216, '259f97f4992fd5dac747476b879a3ea8dbd61ee49bea51165ba031fdd458de47')
          bounded(Path('scripts/guest-host-query/rehydrate.py'), 16777216, 'c8941dfa7647c5d91a83317053809b28816b9d3df8c8c97af1adb87fd52d5c22')
          PY
      - name: Materialize independent reviewed source files without privilege
        run: |
          python3 -I -S -B -c '
          import hashlib,os,stat,sys
          source,digest,*arguments=sys.argv[1:]
          if os.getuid()==0 or os.geteuid()==0:raise SystemExit("unprivileged rehydrator required")
          fd=os.open(source,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK|os.O_CLOEXEC)
          try:
              before=os.fstat(fd)
              if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1 or before.st_size>16777216:raise SystemExit("rehydrator identity refused")
              data=os.pread(fd,16777217,0);after=os.fstat(fd)
              if (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns)!=(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns):raise SystemExit("rehydrator changed")
          finally:os.close(fd)
          if len(data)!=before.st_size or hashlib.sha256(data).hexdigest()!=digest:raise SystemExit("unreviewed rehydrator refused")
          sys.argv=[source,*arguments]
          exec(compile(data,"<reviewed-host-query-rehydrator>","exec"),{"__name__":"__main__","__file__":source})
          ' scripts/guest-host-query/rehydrate.py c8941dfa7647c5d91a83317053809b28816b9d3df8c8c97af1adb87fd52d5c22 --archive out/host-query-approved/source.tar.gz --compile-receipt out/host-query-approved/compile-receipt.json --destination out/host-query-approved/materialized-source --archive-sha256 2d4eba662b891c0b2c41881f1731e8a685a0e0011043da9f5ac4aac52b69d9cb --compile-sha256 724f90b9ca31b63f9bf2d19d111e500f918aaf8b0513b70a5cde998aec0cac9d
      - name: Require existing disposable fixture facilities
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          command -v /usr/bin/python3
          command -v /bin/bash
          command -v /bin/sleep
          command -v /bin/cat
          command -v /usr/bin/setsid
          command -v ldd
      - name: Run only the externally admitted stdlib parent on disposable data
        run: |
          sudo -n /usr/bin/python3 -I -S -B -c '
          import hashlib,os,stat,sys
          source,digest,*arguments=sys.argv[1:]
          fd=os.open(source,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK|os.O_CLOEXEC)
          try:
              before=os.fstat(fd)
              if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1 or before.st_size>16777216:raise SystemExit("parent identity refused")
              data=os.pread(fd,16777217,0);after=os.fstat(fd)
              if (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns)!=(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns):raise SystemExit("parent changed")
          finally:os.close(fd)
          if len(data)!=before.st_size or hashlib.sha256(data).hexdigest()!=digest:raise SystemExit("unreviewed parent refused")
          sys.argv=[source,*arguments]
          exec(compile(data,"<reviewed-host-query-parent>","exec"),{"__name__":"__main__","__file__":source})
          ' scripts/guest-host-query/stage.py 259f97f4992fd5dac747476b879a3ea8dbd61ee49bea51165ba031fdd458de47 --source out/host-query-approved/materialized-source --artifacts out/host-query-approved --receipt out/host-query-approved/receipt.json --approved-receipt-sha256 62d2f8d5008724702bf1440b2aa9bdcd3d28ddbbf79247a1d1bac63ef49ca3b7 --approved-parent-sha256 259f97f4992fd5dac747476b879a3ea8dbd61ee49bea51165ba031fdd458de47
